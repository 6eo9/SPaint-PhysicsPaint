<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="spaint line-art instrument mark">
  <!-- spaint mark: a folded sheet, a compass and one measured arc.
       Drawn by hand as plain strokes: no gradients, no colour, no effects. -->
  <g fill="none" stroke="#171717" stroke-linecap="round" stroke-linejoin="round">
    <!-- folded sheet -->
    <path d="M31 19 L83 19 L98 34 L98 106 L31 106 Z" stroke-width="2.4"/>
    <path d="M83 19 L83 34 L98 34" stroke-width="1.6"/>
    <path d="M39 105 L96 105" stroke-width="0.9" opacity="0.45"/>

    <!-- faint coordinate paper -->
    <g stroke-width="1" opacity="0.38">
      <path d="M39 46 L89 46"/>
      <path d="M39 70 L89 70"/>
      <path d="M39 94 L89 94"/>
      <path d="M58 36 L58 100"/>
      <path d="M78 36 L78 100"/>
    </g>

    <!-- ruler ticks on the lower edge -->
    <g stroke-width="1.1" opacity="0.7">
      <path d="M37 101 L37 105"/>
      <path d="M45 102 L45 105"/>
      <path d="M53 101 L53 105"/>
      <path d="M61 102 L61 105"/>
      <path d="M69 101 L69 105"/>
      <path d="M77 102 L77 105"/>
      <path d="M85 101 L85 105"/>
      <path d="M93 102 L93 105"/>
    </g>

    <!-- the arc being drawn, centred on the fixed compass point -->
    <path d="M84 84 A36 36 0 0 0 48 48" stroke-width="1.8" opacity="0.85"/>
    <circle cx="48" cy="84" r="2.1" stroke-width="1.4"/>

    <!-- compass hinge -->
    <circle cx="64" cy="23" r="4.6" stroke-width="2"/>
    <path d="M61 23 L67 23" stroke-width="1.1"/>

    <!-- legs: fixed point on the left, pencil on the right -->
    <path d="M62 27 C58 43 52 65 48 81" stroke-width="2.8"/>
    <path d="M66 27 C72 44 79 65 83 81" stroke-width="2.4"/>
    <path d="M48 81 L45 90 L52 86 Z" fill="#171717" stroke-width="1"/>
    <path d="M83 81 L86 88 L79 85 Z" fill="#171717" stroke-width="1"/>
    <path d="M80 79 L86 81" stroke-width="1"/>
  </g>
</svg>
